<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Clip path to make the logo perfectly circular -->
    <clipPath id="circleClip">
      <circle cx="250" cy="250" r="245" />
    </clipPath>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b0813" />
      <stop offset="50%" stop-color="#28040b" />
      <stop offset="100%" stop-color="#140105" />
    </linearGradient>
    <linearGradient id="curtainGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#990012" />
      <stop offset="30%" stop-color="#d60a21" />
      <stop offset="50%" stop-color="#b30014" />
      <stop offset="70%" stop-color="#d60a21" />
      <stop offset="100%" stop-color="#80000f" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0a838" />
      <stop offset="50%" stop-color="#fce28b" />
      <stop offset="100%" stop-color="#c48e21" />
    </linearGradient>
  </defs>

  <g clip-path="url(#circleClip)">
    <!-- Main Background -->
    <rect width="500" height="500" fill="url(#bgGrad)" />

    <!-- Stage Arch Top -->
    <path d="M 50,60 Q 250,15 450,60 L 460,95 Q 250,50 40,95 Z" fill="url(#goldGrad)" />
    <path d="M 60,70 Q 250,30 440,70 L 445,90 Q 250,55 55,90 Z" fill="#b30014" />

    <!-- Curtains Left & Right -->
    <!-- Left Curtain -->
    <path d="M 30,60 C 120,80 140,200 40,380 L 10,380 L 10,60 Z" fill="url(#curtainGrad)" />
    <path d="M 10,60 Q 90,200 130,220 Q 90,240 10,380 Z" fill="#80000f" opacity="0.4" />
    <rect x="20" y="215" width="110" height="12" rx="6" fill="url(#goldGrad)" />

    <!-- Right Curtain -->
    <path d="M 470,60 C 380,80 360,200 460,380 L 490,380 L 490,60 Z" fill="url(#curtainGrad)" />
    <path d="M 490,60 Q 410,200 370,220 Q 410,240 490,380 Z" fill="#80000f" opacity="0.4" />
    <rect x="370" y="215" width="110" height="12" rx="6" fill="url(#goldGrad)" />

    <!-- Theater Seats Silhouette at Bottom -->
    <g fill="#180206">
      <!-- Back row seats -->
      <rect x="20" y="380" width="70" height="120" rx="15" />
      <rect x="100" y="370" width="75" height="130" rx="15" />
      <rect x="185" y="365" width="75" height="135" rx="15" />
      <rect x="270" y="365" width="75" height="135" rx="15" />
      <rect x="355" y="370" width="75" height="130" rx="15" />
      <rect x="440" y="380" width="70" height="120" rx="15" />

      <!-- Front row seats -->
      <rect x="40" y="410" width="80" height="100" rx="15" fill="#0d0103" />
      <rect x="130" y="400" width="80" height="110" rx="15" fill="#0d0103" />
      <rect x="220" y="395" width="80" height="115" rx="15" fill="#0d0103" />
      <rect x="310" y="400" width="80" height="110" rx="15" fill="#0d0103" />
      <rect x="400" y="410" width="80" height="100" rx="15" fill="#0d0103" />
    </g>

    <!-- Center Logo White Box -->
    <g transform="translate(250, 240)">
      <!-- Outer Border Box -->
      <rect x="-175" y="-55" width="350" height="110" fill="#ffffff" stroke="#800010" stroke-width="4" rx="2" />

      <!-- Left Comedy Mask -->
      <g transform="translate(-135, 0)">
        <path d="M -25,-35 C 5,-38 25,-25 22,25 C 20,40 -15,42 -25,25 C -30,-5 -30,-30 -25,-35 Z" fill="#800010" />
        <!-- Eyes -->
        <ellipse cx="-12" cy="-10" rx="4" ry="6" fill="#ffffff" transform="rotate(-15 -12 -10)" />
        <ellipse cx="8" cy="-8" rx="4" ry="6" fill="#ffffff" transform="rotate(15 8 -8)" />
        <!-- Smile -->
        <path d="M -16,8 Q -2,24 12,8 Q -2,16 -16,8 Z" fill="#ffffff" />
      </g>

      <!-- Center Text: il Sipario / compagnia teatrale -->
      <g text-anchor="middle">
        <text x="3" y="-3" font-family="'Times New Roman', Times, serif" font-size="44" font-weight="bold" fill="#800010" letter-spacing="-1">
          <tspan font-weight="normal" fill="#222222" font-size="36">il</tspan>Sipario
        </text>
        <text x="3" y="32" font-family="'Arial', 'Helvetica', sans-serif" font-size="18" font-weight="normal" fill="#800010" letter-spacing="0.5">
          compagnia teatrale
        </text>
      </g>

      <!-- Right Tragedy Mask -->
      <g transform="translate(138, 0)">
        <path d="M 25,-35 C -5,-38 -25,-25 -22,25 C -20,40 15,42 25,25 C 30,-5 30,-30 25,-35 Z" fill="#800010" />
        <!-- Eyes -->
        <ellipse cx="-8" cy="-8" rx="4" ry="6" fill="#ffffff" transform="rotate(-15 -8 -8)" />
        <ellipse cx="12" cy="-10" rx="4" ry="6" fill="#ffffff" transform="rotate(15 12 -10)" />
        <!-- Frown -->
        <path d="M -12,18 Q 2,4 16,18 Q 2,10 -12,18 Z" fill="#ffffff" />
      </g>
    </g>

    <!-- Outer Gold Ring Accent -->
    <circle cx="250" cy="250" r="243" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
  </g>
</svg>
